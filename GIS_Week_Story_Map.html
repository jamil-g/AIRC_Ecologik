const shopNode = "275,260";
const walkingMetersPerMinute = 80;
const metersPerMapUnit = 1.524;
let walkMinutes = 4;

function buildWalkingNetwork() {
  const neighbors = new Map();
  const edges = [];
  const vertices = new Map();
  const previous = new Map();
  for (const [streetIndex, street] of streets.entries()) {
    for (const [pathIndex, path] of street[4].split(";").entries()) {
      const nodes = path.split(" ");
      const coordinates = streetLatLon[streetIndex][pathIndex];
      for (let i = 1; i < nodes.length; i++) {
        const [from, to] = [nodes[i - 1], nodes[i]];
        if (from === to) continue;
        const [a, b] = [from, to].map(node => node.split(",").map(Number));
        const meters = Math.hypot(b[0] - a[0], b[1] - a[1]) * metersPerMapUnit;
        edges.push({ from, to, a, b, meters, latLng: [coordinates[i - 1], coordinates[i]] });
        vertices.set(from, { xy: a, latLng: coordinates[i - 1] });
        vertices.set(to, { xy: b, latLng: coordinates[i] });
        if (!neighbors.has(from)) neighbors.set(from, []);
        if (!neighbors.has(to)) neighbors.set(to, []);
        neighbors.get(from).push([to, meters]);
        neighbors.get(to).push([from, meters]);
      }
    }
  }
  const distance = new Map([[shopNode, 0]]);
  const pending = new Set(neighbors.keys());
  while (pending.size) {
    let closest;
    let best = Infinity;
    for (const node of pending) {
      const meters = distance.get(node) ?? Infinity;
      if (meters < best) {
        closest = node;
        best = meters;
      }
    }
    if (closest === undefined) break;
    pending.delete(closest);
    for (const [neighbor, length] of neighbors.get(closest)) {
      const candidate = best + length;
      if (candidate < (distance.get(neighbor) ?? Infinity)) {
        distance.set(neighbor, candidate);
        previous.set(neighbor, closest);
      }
    }
  }
  return { edges, distance, vertices, previous, shopLatLng: vertices.get(shopNode).latLng };
}

const walkingNetwork = buildWalkingNetwork();

function reachableLines(minutes) {
  const budget = minutes * walkingMetersPerMinute;
  return walkingNetwork.edges.flatMap(edge => {
    const { from, to, meters } = edge;
    const fraction = node => Math.max(0, Math.min(1, (budget - (walkingNetwork.distance.get(node) ?? Infinity)) / meters));
    const fromFraction = fraction(from);
    const toFraction = fraction(to);
    if (fromFraction + toFraction >= 1) return [{ edge, start: 0, end: 1 }];
    const lines = [];
    if (fromFraction > 0) lines.push({ edge, start: 0, end: fromFraction });
    if (toFraction > 0) lines.push({ edge, start: 1 - toFraction, end: 1 });
    return lines;
  });
}

function walkLineCoordinates(a, b, start, end) {
  return [start, end].map(fraction => a.map((value, axis) => value + (b[axis] - value) * fraction));
}

function exampleWalk(minutes) {
  const cutoff = reachableLines(minutes).find(({ start, end }) => start > 0 || end < 1);
  const { edge, start, end } = cutoff;
  const [fraction, nextNode] = start > 0 ? [start, edge.to] : [end, edge.from];
  const point = ([a, b]) => walkLineCoordinates(a, b, fraction, fraction)[0];
  const xy = [point([edge.a, edge.b])];
  const latLng = [point(edge.latLng)];
  let node = nextNode;
  while (node) {
    const vertex = walkingNetwork.vertices.get(node);
    xy.push(vertex.xy);
    latLng.push(vertex.latLng);
    node = walkingNetwork.previous.get(node);
  }
  return { xy, latLng };
}

function walkOverlay() {
  const route = exampleWalk(walkMinutes);
  const [startX, startY] = route.xy[0];
  const [x, y] = shopNode.split(",").map(Number);
  const radius = walkMinutes * walkingMetersPerMinute / metersPerMapUnit;
  const paths = reachableLines(walkMinutes).map(({ edge, start, end }) => {
    const [a, b] = walkLineCoordinates(edge.a, edge.b, start, end);
    return `<path d="M${a.join(",")}L${b.join(",")}" stroke="#096e58" stroke-width="6" stroke-linecap="round" fill="none"/>`;
  }).join("");
  return `<circle cx="${x}" cy="${y}" r="${radius}" stroke="#355a8c" stroke-width="2.5" stroke-dasharray="8 6" fill="none"/>
    ${paths}
    <polyline points="${route.xy.map(point => point.join(",")).join(" ")}" fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="${route.xy.map(point => point.join(",")).join(" ")}" fill="none" stroke="#ba4c0c" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${startX}" cy="${startY}" r="9" fill="#ba4c0c" stroke="white" stroke-width="3"/>
    <text x="${startX}" y="${startY - 14}" text-anchor="middle" class="walk-marker-label">Start</text>
    <circle cx="${x}" cy="${y}" r="8" fill="#162d29" stroke="white" stroke-width="3"/>
    <text x="${x + 15}" y="${y + 22}" class="walk-marker-label">Shop</text>`;
}

function drawWalkingMap() {
  get("map-fallback").innerHTML = roadMap(true);
  if (mapView.walkLayer) updateLiveWalk(mapView, window.L);
  get("walk-distance").textContent = `Start → Shop · ${walkMinutes} min one way`;
}

function updateLiveWalk(view, L) {
  view.walkLayer.clearLayers();
  L.circle(walkingNetwork.shopLatLng, { radius: walkMinutes * walkingMetersPerMinute,
    color: "#547cba", fill: false, dashArray: "8 6", weight: 3, interactive: false }).addTo(view.walkLayer);
  for (const { edge, start, end } of reachableLines(walkMinutes)) {
    L.polyline(walkLineCoordinates(...edge.latLng, start, end), {
      color: basemap === "satellite" ? "#35e8b0" : "#096e58", weight: 5, interactive: false
    }).addTo(view.walkLayer);
  }
  const route = exampleWalk(walkMinutes);
  L.polyline(route.latLng, { color: "#fff", weight: 10, interactive: false }).addTo(view.walkLayer);
  L.polyline(route.latLng, { color: "#ba4c0c", weight: 6, interactive: false }).addTo(view.walkLayer);
  L.circleMarker(route.latLng[0], { radius: 8, color: "#fff", weight: 2, fillColor: "#ba4c0c", fillOpacity: 1 })
    .bindTooltip("Start", { permanent: true, direction: "top" }).addTo(view.walkLayer);
  L.circleMarker(walkingNetwork.shopLatLng, { radius: 7, color: "#fff", weight: 2, fillColor: "#162d29", fillOpacity: 1 })
    .bindTooltip("Shop", { permanent: true, direction: "bottom" }).addTo(view.walkLayer);
}

// Shared basemap choice. The SVG view remains available when live tiles cannot load.
const basemaps = {
  streets: {
    title: "Streets",
    url: "https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}",
    attribution: 'Tiles: <a href="https://www.usgs.gov/programs/national-geospatial-program/national-map" target="_blank" rel="noopener">USGS The National Map</a>',
    maxNativeZoom: 19
  },
  satellite: {
    title: "Satellite",
    url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    attribution: 'Imagery © <a href="https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer" target="_blank" rel="noopener">Esri</a>, Vantor, Earthstar Geographics, and the GIS User Community',
    maxNativeZoom: 19
  }
};
let basemap = "streets";
let mapView = null;
let leafletPromise;

function loadLeaflet() {
  if (!leafletPromise) {
    const root = "https://unpkg.com/leaflet@1.9.4/dist/";
    const css = document.createElement("link");
    const script = document.createElement("script");
    css.rel = "stylesheet";
    css.href = root + "leaflet.css";
    css.integrity = "sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=";
    script.src = root + "leaflet.js";
    script.integrity = "sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=";
    leafletPromise = Promise.all([css, script].map(asset => new Promise((resolve, reject) => {
      asset.crossOrigin = "anonymous";
      asset.onload = resolve;
      asset.onerror = reject;
      document.head.append(asset);
    }))).then(() => window.L).catch(error => {
      css.remove();
      script.remove();
      leafletPromise = null;
      throw error;
    });
  }
  return leafletPromise;
}

function mountMap(isRoad, isWalk = false) {
  const figure = get("figure");
  figure.innerHTML = `<div class="map-panel">
    <div class="map-toolbar" role="group" aria-label="Map background">
      <button type="button" data-basemap="streets">Streets</button>
      <button type="button" data-basemap="satellite">Satellite</button>
      <button type="button" data-basemap="offline">Offline</button>
      <button type="button" id="map-reset" class="map-reset" hidden>Reset view</button>
      <span class="map-status" id="map-status" role="status"></span>
    </div>
    <div class="map-viewport">
      <div id="map-fallback" class="map-fallback">${isRoad ? roadMap(isWalk) : stateMap()}</div>
      <div id="live-map" class="live-map" role="region" aria-label="${isRoad ? "Interactive Seattle street condition map" : "Interactive Washington population map"}" aria-hidden="true" inert></div>
    </div>
  </div>`;
  mapView = { isRoad, isWalk, map: null, layer: null, ready: false, request: 0, timer: null };
  applyBasemap(mapView);
}

function showLive(view, visible) {
  view.ready = visible;
  get("live-map").classList.toggle("is-live", visible);
  get("live-map").toggleAttribute("inert", !visible);
  get("live-map").setAttribute("aria-hidden", String(!visible));
  get("map-fallback").setAttribute("aria-hidden", String(visible));
  get("map-reset").hidden = !visible;
}

function clearBasemap(view) {
  clearTimeout(view.timer);
  if (view.layer) view.layer.remove();
  view.layer = null;
  view.timer = null;
}

function disposeMap() {
  if (!mapView) return;
  clearBasemap(mapView);
  if (mapView.map) mapView.map.remove();
  mapView = null;
}

function resetMap(view) {
  view.map.fitBounds(view.bounds, { padding: [32, 30], maxZoom: view.isRoad ? 17 : 8, animate: false });
}

function roadColor(score) {
  if (highlight && lowScore(score)) return "#d42d18";
  return basemap === "satellite" ? "#eef6f3" : "#506b64";
}

function initLiveMap(view, L) {
  view.map = L.map(get("live-map"), { minZoom: 4, maxZoom: 19, scrollWheelZoom: false });
  L.control.scale({ position: "bottomleft", metric: true, imperial: false }).addTo(view.map);
  if (view.isRoad) {
    view.roads = streets.map(([name, from, to, score], i) => {
      const paths = streetLatLon[i];
      L.polyline(paths, { color: "#172a28", weight: 7.5, opacity: .8, interactive: false }).addTo(view.map);
      return L.polyline(paths, { color: view.isWalk ? "#788e84" : roadColor(score), weight: 4.5, opacity: .96 })
        .bindTooltip(`${name} · ${from} to ${to}<br>Recorded pavement score: ${score}`)
        .bindPopup(`<strong>${name}</strong><br>${from} to ${to}<br>Recorded pavement score: ${score}`)
        .addTo(view.map);
    });
    view.bounds = L.latLngBounds(streetLatLon.flat(2));
    if (view.isWalk) {
      view.walkLayer = L.layerGroup().addTo(view.map);
      const [lat, lon] = walkingNetwork.shopLatLng;
      const latSpan = 480 / 111320;
      const lonSpan = latSpan / Math.cos(lat * Math.PI / 180);
      view.bounds.extend([[lat - latSpan, lon - lonSpan], [lat + latSpan, lon + lonSpan]]);
      updateLiveWalk(view, L);
    }
  } else {
    L.polygon(boundary.map(polygon => polygon.map(ring => ring.map(([lon, lat]) => [lat, lon]))),
      { color: "#408778", weight: 2, fill: false, interactive: false }).addTo(view.map);
    view.cities = [...cities].reverse().map(([name, pop, lat, lon]) =>
      L.circleMarker([lat, lon], { radius: 25 * Math.sqrt(pop / cities[0][1]), color: "#fffef4", weight: 1.4,
        fillColor: "#12856c", fillOpacity: .7 })
        .bindTooltip(`${name} · ${fmt.format(pop)} residents`)
        .bindPopup(`<strong>${name}</strong><br>${fmt.format(pop)} residents · 2020 Census`)
        .addTo(view.map)
    );
    view.bounds = L.latLngBounds([[45.54, -124.71], [49.01, -116.91]]);
  }
  resetMap(view);
}

function recolorMap(view) {
  if (view.walkLayer) updateLiveWalk(view, window.L);
  else if (view.roads) {
    view.roads.forEach((line, i) => line.setStyle({ color: roadColor(streets[i][3]) }));
    view.roads.forEach((line, i) => {
      if (highlight && lowScore(streets[i][3])) line.bringToFront();
    });
  }
  if (view.cities) view.cities.forEach(marker => marker.setStyle({ fillColor: basemap === "satellite" ? "#39e2ba" : "#12856c" }));
}

async function applyBasemap(view) {
  const selected = basemap;
  const request = ++view.request;
  const isCurrent = () => mapView === view && view.request === request;
  const status = get("map-status");
  for (const button of get("figure").querySelectorAll("[data-basemap]")) {
    button.setAttribute("aria-pressed", String(button.dataset.basemap === selected));
  }
  clearBasemap(view);
  showLive(view, false);
  if (selected === "offline") {
    status.textContent = "Embedded map";
    return;
  }
  status.textContent = "Loading background…";
  const fail = () => {
    if (!isCurrent()) return;
    clearBasemap(view);
    status.textContent = "Background unavailable · embedded map shown";
  };
  view.timer = setTimeout(fail, 8000);
  try {
    const L = await loadLeaflet();
    if (!isCurrent() || view.timer === null) return;
    if (!view.map) initLiveMap(view, L);
    const {url, attribution, maxNativeZoom} = basemaps[selected];
    const layer = L.tileLayer(url, { attribution, maxNativeZoom, maxZoom: 19 });
    view.layer = layer;
    recolorMap(view);
    layer.once("tileload", () => {
      if (!isCurrent() || view.layer !== layer) return;
      clearTimeout(view.timer);
      view.timer = null;
      showLive(view, true);
      status.textContent = "";
    });
    layer.once("load", () => {
      if (isCurrent() && view.layer === layer && !view.ready) fail();
    });
    layer.addTo(view.map);
  } catch {
    fail();
  }
}

get("figure").addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button || !mapView) return;
  if (button.id === "map-reset") resetMap(mapView);
  if (button.dataset.basemap) {
    const selected = button.dataset.basemap;
    if (selected === basemap && (mapView.ready || mapView.timer !== null)) return;
    basemap = selected;
    applyBasemap(mapView);
  }
});

function draw() {
  disposeMap();
  const chapter = chapters[step];
  get("kicker").textContent = chapter.tag;
  get("title").textContent = chapter.title;
  get("intro").textContent = chapter.intro;
  get("question").textContent = chapter.takeaway;
  get("visual-title").textContent = chapter.visual;
  get("maptag").textContent = chapter.label;
  get("note").textContent = chapter.notes;
  get("meta").textContent = `${step + 1} / ${chapters.length}`;
  get("dots").innerHTML = chapters.map((_, i) => `<span class="dot${i <= step ? " on" : ""}"></span>`).join("");
  get("prev").disabled = step === 0;
  get("next").textContent = ["Show the map →", "Street example →", "Show the streets →", "Walking service area →", "Wrap up →", "Seattle in 3D →", "Start again ↺"][step];
  get("controls").innerHTML = step === 3
    ? '<button id="highlight" type="button" class="primary" aria-pressed="false">Highlight low scores</button><p id="result" class="result-line" aria-live="polite"></p>'
    : step === 4
      ? `<label for="walk-time">Walking time</label>
        <select id="walk-time">
          ${[2, 4, 6].map(minutes => `<option value="${minutes}"${minutes === walkMinutes ? " selected" : ""}>${minutes} min</option>`).join("")}
        </select>
        <p id="walk-distance" class="result-line" aria-live="polite"></p>`
      : step === 6
        ? `<a class="primary scene-link" href="${seattleSceneUrl}" target="_blank" rel="noopener">Open in Scene Viewer ↗</a>`
        : "";
  const source = get("legend");
  const figure = get("figure");
  if (step === 0) {
    figure.innerHTML = table(["Rank", "Place", "Residents"], cities.map(([name, pop], i) => [i + 1, name, fmt.format(pop)]), "Scrollable Washington population table");
    source.innerHTML = `Source: <a href="${censusUrl}" target="_blank" rel="noopener">U.S. Census Bureau, Census 2020</a> · City limits`;
  } else if (step === 1) {
    mountMap(false);
    source.innerHTML = `Circle area = city population · <a href="${censusUrl}" target="_blank" rel="noopener">Census 2020</a> · <a href="${boundaryUrl}" target="_blank" rel="noopener">State outline</a>`;
  } else if (step === 2) {
    figure.innerHTML = table(["Street", "Cross street", "Cross street", "Score"], streets.map(row => row.slice(0, 4)), "Scrollable Seattle street condition table");
    source.innerHTML = `${streets.length} segments in this sample · <a href="${streetsUrl}" target="_blank" rel="noopener">Seattle Department of Transportation</a>`;
  } else if (step === 3) {
    mountMap(true);
    drawRoads();
  } else if (step === 4) {
    mountMap(true, true);
    drawWalkingMap();
    source.innerHTML = `<span class="route-key"></span> Example route · <span class="walk-key"></span> Reachable streets · <span class="radius-key"></span> Straight-line radius<br>4.8 km/h assumed · 96 sampled <a href="${streetsUrl}" target="_blank" rel="noopener">SDOT</a> street segments`;
  } else if (step === 6) {
    figure.innerHTML = `<div class="scene-panel"><iframe src="${seattleSceneUrl}" title="Downtown Seattle 3D buildings" allowfullscreen></iframe></div>`;
    source.innerHTML = '3D building layer from <a href="https://www.arcgis.com/home/item.html?id=b8fec5af7dfe4866b1b8ac2d2800f282" target="_blank" rel="noopener">Esri Living Atlas</a> · Requires internet and WebGL';
  } else {
    figure.innerHTML = '<div class="career"><ol><li><strong>Geography</strong><span>I learned to look for patterns across places.</span></li><li><strong>Navigation data</strong><span>I worked on the road data behind the maps people use.</span></li><li><strong>GIS development</strong><span>I build tools that turn spatial data into decisions people can explain.</span></li></ol></div>';
    source.textContent = "GIS Week · From a spreadsheet to a place on the map";
  }
}

function drawRoads() {
  get("map-fallback").innerHTML = roadMap();
  recolorMap(mapView);
  const button = get("highlight");
  button.setAttribute("aria-pressed", String(highlight));
  button.textContent = highlight ? "Show plain streets" : "Highlight low scores";
  get("result").textContent = highlight ? `${flaggedCount} of ${streets.length} segments highlighted` : "";
  get("legend").innerHTML = highlight
    ? `<span class="swatch"></span><span class="label">Red = score 1–39</span> · Demo threshold · <a href="${streetsUrl}" target="_blank" rel="noopener">SDOT</a>`
    : `Street geometry · Color layer off · <a href="${streetsUrl}" target="_blank" rel="noopener">SDOT</a>`;
}

function go(next, focus = true) {
  if (next < 0 || next >= chapters.length) return;
  if (next === 0) {
    highlight = false;
    walkMinutes = 4;
  }
  step = next;
  draw();
  if (focus) get("title").focus({ preventScroll: true });
}

get("controls").addEventListener("click", event => {
  if (event.target.id !== "highlight") return;
  highlight = !highlight;
  drawRoads();
});
get("controls").addEventListener("change", event => {
  if (event.target.id !== "walk-time") return;
  walkMinutes = Number(event.target.value);
  drawWalkingMap();
});
get("prev").addEventListener("click", () => go(step - 1));
get("next").addEventListener("click", () => go((step + 1) % chapters.length));

const full = get("full");
if (!document.fullscreenEnabled) full.hidden = true;
full.addEventListener("click", () => {
  const request = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  request.catch(() => { full.hidden = true; });
});
document.addEventListener("fullscreenchange", () => {
  full.textContent = document.fullscreenElement ? "Exit full screen" : "Full screen";
});
document.addEventListener("keydown", event => {
  if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.target.closest(".live-map, select")) return;
  if (event.key === "ArrowRight") go(step + 1);
  if (event.key === "ArrowLeft") go(step - 1);
});
go(0, false);
</script>
</body>
